<style>

}

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  color-scheme:dark; } }

  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --fg:#ffffff; --fg-2:#c3c2b7; --muted:#898781;

<div id="app"><div class="onboard"><h1>Starting up…</h1></div></div>

<script>
/* ============================================================================
   AJIO Seller Control — an operations dashboard for AJIO (Dropship/VMS) sellers.

   PRIVACY: this page ships with NO seller data. Everything you load stays in
   your own browser (localStorage) and is never uploaded anywhere. The repository
   is deliberately data-free so it can be public without exposing pricing.
   ========================================================================== */

const RUPEE = '₹';
const fmt   = n => n==null||isNaN(n) ? '—' : Math.round(n).toLocaleString('en-IN');
const money = n => n==null||isNaN(n) ? '—' : RUPEE+Math.round(n).toLocaleString('en-IN');
const pct1  = n => n==null||isNaN(n) ? '—' : n.toFixed(1)+'%';
const esc   = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const LS_DATA='ajio_td_rows', LS_QC='ajio_qc', LS_BRAND='ajio_brand';

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};

const AJIO_REPORTS = [
  ['Dropship Order Report','Orders, Fulfilment, Product Performance','order status, qty, MRP, Seller TD, selling price, SLA'],
  ['Dropship Shipment Report','Fulfilment timings','dispatch, carrier, AWB'],
  ['Dropship Pendency Report','Action Centre','orders awaiting dispatch'],
  ['Dropship Rtv Report','Returns, Return Loss','return to vendor records'],
  ['Dropship Payment Report','Settlements','payouts and deductions'],
  ['Credit Note Report','Returns, Settlements','refund / credit notes'],
  ['Invoice Report','Settlements','invoice values'],
  ['Dropship GST Report','Settlements','tax entries'],
];

let ROWS=[], STATE=null, QC=null, BRAND='', IMPORTED={};

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}

/* Accepts either the exported CSV (jioCode/currentTD) or AJIO's own
   Trade Discount Excel template (JioCode / Default Discount). */
function normalise(raw){
  const pick=(o,names)=>{ for(const n of names){ for(const k of Object.keys(o)){ if(k.toLowerCase().replace(/[^a-z]/g,'')===n) return o[k]; } } return undefined; };
  const num=v=>{ if(v===''||v==null) return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; };
  return raw.map(o=>{
    const mrp=num(pick(o,['mrp']));
    const td =num(pick(o,['currenttd','defaultdiscount','tradediscount','td']));
    return {
      jio:  pick(o,['jiocode','articlenumber'])||'',
      sku:  pick(o,['sellersku','sku'])||'',
      style:pick(o,['sellerstylecode','stylecode'])||'',
      mrp, td,
      price: (mrp!=null&&td!=null) ? +(mrp*(1-td/100)).toFixed(2) : null,
    };
  }).filter(r=>r.jio||r.sku);
}

/* ---------- derive ---------- */
function derive(recs){
  const priced=recs.filter(r=>r.td!=null&&r.mrp!=null);
  const noTd  =recs.filter(r=>r.td==null);
  const lowTd =priced.filter(r=>r.td<=20);
  const healthy=priced.filter(r=>r.td>20);
  const buckets=[
    ['≤ 5% (at MRP)', r=>r.td<=5,           'var(--crit)'],
    ['5 – 20%',       r=>r.td>5&&r.td<=20,  'var(--serious)'],
    ['20 – 40%',      r=>r.td>20&&r.td<=40, 'var(--s4)'],
    ['40 – 55%',      r=>r.td>40&&r.td<=55, 'var(--s3)'],
    ['55 – 65%',      r=>r.td>55&&r.td<=65, 'var(--s1)'],
    ['65 – 75%',      r=>r.td>65&&r.td<=75, 'var(--s5)'],
    ['> 75%',              r=>r.td>75,           'var(--s2)'],
  ].map(([label,f,color])=>({label,color,n:priced.filter(f).length}));
  const avg=(a,f)=>a.length?a.reduce((s,x)=>s+f(x),0)/a.length:null;
  // Lookup by JioCode or Seller SKU, for the price calculator.
  const index=new Map();
  recs.forEach(r=>{
    if(r.jio) index.set(String(r.jio).trim().toLowerCase(),r);
    if(r.sku) index.set(String(r.sku).trim().toLowerCase(),r);
  });
  return {
    recs,priced,noTd,lowTd,healthy,buckets,index,
    total:recs.length,
    blocked:noTd.length+lowTd.length,
    blockedPct:recs.length?((noTd.length+lowTd.length)/recs.length)*100:0,
    avgTd:avg(priced,r=>r.td),
    avgPrice:avg(priced,r=>r.price),
    avgPriceHealthy:avg(healthy,r=>r.price),
    avgPriceLow:avg(lowTd,r=>r.price),
    minTd:priced.length?Math.min(...priced.map(r=>r.td)):null,
    maxTd:priced.length?Math.max(...priced.map(r=>r.td)):null,
  };
}

/* ---------- view helpers ---------- */
const tile=(k,v,d,cls='')=>`<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`;
const na  =(k,need)=>`<div class="tile na"><div class="k">${k}</div><div class="v">Not available</div><div class="d">Needs ${esc(need)}</div></div>`;

function emptyState(title,why,reports){
  return `<div class="empty"><h4>${title}</h4><p>${why}</p>
    <div class="need">${reports.map(r=>`<span>${esc(r)}</span>`).join('')}</div>
    <p class="srcnote">Download it in Seller Central under <code>Reporting › View Reports</code>, then load it on the Reports &amp; Imports tab.</p></div>`;
}
function barChart(items,total,note){
  const max=Math.max(...items.map(i=>i.n),1);
  return `<div class="bars">${items.map(i=>`<div class="bar">
    <div class="lbl">${i.label}</div>
    <div class="track"><div class="fill" style="width:${(i.n/max*100).toFixed(1)}%;background:${i.color}"></div></div>
    <div class="val">${fmt(i.n)}</div></div>`).join('')}</div>
    ${note?`<div class="srcnote">${note}</div>`:''}`;
}

/* ---------- price → trade discount engine ----------
   AJIO takes a percentage, not a price. This inverts it:
     TD = (1 − price / MRP) × 100, rounded to the 2 decimals AJIO accepts.
   Rounding means an exact target price is not always reachable, so the actual
   resulting price is always shown back rather than assumed. */
function tdFromPrice(mrp,price){
  if(mrp==null||!(mrp>0)) return {err:'MRP is unknown for this product'};
  if(price==null||isNaN(price)) return {err:'Enter a selling price'};
  if(price<=0) return {err:'Price must be above zero'};
  if(price>mrp) return {err:`Price is above MRP of ${money(mrp)} — AJIO has no negative discount`};
  const exact=(1-price/mrp)*100;
  const td=Math.round(exact*100)/100;
  const actual=Math.round(mrp*(1-td/100)*100)/100;
  return {td,exact,actual,delta:+(actual-price).toFixed(2)};
}
/* Median TD this catalog already uses at the same MRP — the sanity check that
   stands in for margin data we do not have. */
function bandMedian(mrp){
  const peers=STATE.healthy.filter(r=>r.mrp===mrp).map(r=>r.td).sort((a,b)=>a-b);
  return peers.length?{med:peers[Math.floor(peers.length/2)],n:peers.length}:null;
}
function lookup(code){
  if(!code) return null;
  return STATE.index.get(String(code).trim().toLowerCase())||null;
}
const AJIO_HEAD=['JioCode','EAN','Seller Style Code','Seller SKU','MRP','Default Discount',
  'Default Start Date(dd-MM-yyyy HH:mm:ss)','Promotional Discount',
  'Start Date(dd-MM-yyyy HH:mm:ss)','End Date(dd-MM-yyyy HH:mm:ss)'];
function csvCell(v){const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function buildAjioCSV(rows){
  return [AJIO_HEAD.join(',')].concat(rows.map(r=>[
    r.rec.jio,r.rec.style,r.rec.style,r.rec.sku,r.rec.mrp,
    r.def?r.def.td:'', r.def?r.start:'',
    r.promo?r.promo.td:'', r.promo?r.promoStart:'', r.promo?r.promoEnd:'',
  ].map(csvCell).join(','))).join('\n');
}

const TABS=[
  ['overview','Overview','live'],['pricing','Pricing &amp; Promotions','live'],
  ['calc','Price Calculator','live'],
  ['catalog','Catalog Health','part'],['products','Product Performance','part'],
  ['orders','Orders','off'],['returns','Returns &amp; Refunds','off'],
  ['loss','Return Loss','off'],['settle','Settlements','off'],
  ['inventory','Inventory','off'],['monthly','Monthly &amp; 6-Month','off'],
  ['actions','Action Centre','live'],['reports','Reports &amp; Imports','live'],
];

function headOf(title,badge,sub){
  const cls=badge==='live'?'live':badge==='part'?'part':'off';
  const txt=badge==='live'?'Your data':badge==='part'?'Partial':'Awaiting report';
  return `<div class="head"><h2>${title}</h2><span class="badge ${cls}">${txt}</span></div><p class="sub">${sub}</p>`;
}

/* ---------- views ---------- */
const VIEWS={
overview(){const s=STATE;
  return headOf('Overview','part',

/* ---------- import ---------- */
const SIGNATURES=[
  ['Trade Discount export',['jiocode','currenttd']],
  ['AJIO price template',['jiocode','default discount']],
  ['Dropship Order Report',['cust order no','order qty']],
  ['Dropship Pendency Report',['cust order no','sla status']],
  ['Dropship Payment Report',['settlement','commission']],
  ['Credit Note Report',['credit note']],
  ['Invoice Report',['invoice no','invoice value']],
  ['Dropship Rtv Report',['return']],
  ['Myntra price file',['style id','article no']],
];
function detect(headers){
  const h=headers.map(x=>String(x).toLowerCase().trim());
  let best=null,score=0;
  for(const [name,sig] of SIGNATURES){
    const s=sig.filter(k=>h.some(x=>x.includes(k))).length;
    if(s>score&&s>=Math.min(2,sig.length)){score=s;best=name;}
  }
  return best;
}
async function readSheet(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});
  if(!rows.length) throw new Error('file has no rows');
  let hi=0,bestN=0;
  for(let i=0;i<Math.min(rows.length,12);i++){const n=rows[i].filter(c=>String(c).trim()).length; if(n>bestN){bestN=n;hi=i;}}
  const headers=rows[hi].map(String);
  const data=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));
  return {headers,data,objects:data.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))};
}
async function handleFiles(files){
  const log=document.getElementById('implog'); if(!log) return;
  for(const f of files){
    try{
      const {headers,data,objects}=await readSheet(f);
      const type=detect(headers)||'Unrecognised layout';
      let extra='';
      if(type==='Trade Discount export'||type==='AJIO price template'){
        const recs=normalise(objects);
        if(recs.length){ ROWS=recs; STATE=derive(recs); store.set(LS_DATA,recs); extra=' Catalog refreshed.'; }
      }
      IMPORTED[type]={name:f.name,rows:data.length};
      log.insertAdjacentHTML('beforeend',`<div class="act"><div class="sev ${type.startsWith('Unrec')?'p2':'p3'}"></div>
        <div class="body"><div class="t">${esc(f.name)}</div><div class="w">Detected as <b>${esc(type)}</b> — ${fmt(data.length)} rows, ${headers.length} columns.${
        type.startsWith('Unrec')?' Headers did not match a known report; nothing was loaded.':esc(extra)}</div></div></div>`);
    }catch(err){
      log.insertAdjacentHTML('beforeend',`<div class="act"><div class="sev p1"></div><div class="body">
        <div class="t">${esc(f.name)}</div><div class="w">Could not read this file: ${esc(err.message)}</div></div></div>`);
    }
  }
}

/* ---------- price calculator wiring ---------- */
const nb=(k,t)=>`<div class="nb ${k}">${t}</div>`;
function startDefault(){ // 1 day ahead at 10:00, comfortably past AJIO's 3-hour rule
  const d=new Date(Date.now()+86400000);
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} 10:00:00`;
}
function guardRail(rec,td){
  const b=bandMedian(rec.mrp);
  if(!b) return nb('mut',`No other product at ${money(rec.mrp)} MRP to compare against — this one is your judgement call.`);
  const gap=td-b.med;
  if(gap>10) return nb('warn',`<b>Deeper than you normally go.</b> You price ${b.n} other ${money(rec.mrp)} products at a median ${b.med.toFixed(2)}% — this is ${gap.toFixed(1)} points more. Margin is not checked here because no cost file is loaded.`);
  if(gap<-10) return nb('warn',`<b>Shallower than you normally go.</b> Your median at ${money(rec.mrp)} is ${b.med.toFixed(2)}%; this is ${Math.abs(gap).toFixed(1)} points less, so it will look expensive beside your own range.`);
  return nb('ok',`In line with the ${b.n} other products you price at ${money(rec.mrp)} (median ${b.med.toFixed(2)}%).`);
}
function priceCol(title,r,target){
  if(r.err) return `<div class="col"><h5>${title}</h5><div class="meta" style="color:var(--crit)">${esc(r.err)}</div></div>`;
  const off=Math.abs(r.delta)>=0.01;
  return `<div class="col"><h5>${title}</h5>
    <div class="big">${r.td.toFixed(2)}%</div>
    <div class="meta">Lists at <b>${money(r.actual)}</b>${off?` — ${r.delta>0?'+':''}${r.delta.toFixed(2)} vs your ${money(target)} target, the closest two decimals allow`:''}</div></div>`;
}
function renderSingle(){
  const out=document.getElementById('c_out'); if(!out) return;
  const code=document.getElementById('c_code').value.trim();
  if(!code){ out.innerHTML=nb('mut','Enter a JioCode or Seller SKU to begin.'); return; }
  const rec=lookup(code);
  if(!rec){ out.innerHTML=nb('crit',`Nothing in your catalog matches “${esc(code)}”. Check the JioCode or Seller SKU.`); return; }
  const dv=parseFloat(document.getElementById('c_def').value);
  const pv=parseFloat(document.getElementById('c_promo').value);
  const def=tdFromPrice(rec.mrp,isNaN(dv)?null:dv);
  const promo=isNaN(pv)?null:tdFromPrice(rec.mrp,pv);
  const cur=rec.td!=null?`currently ${rec.td.toFixed(2)}% → ${money(rec.price)}`:'no trade discount set';
  out.innerHTML=`<div class="res">
      <div class="top"><b>${esc(rec.sku||rec.jio)}</b><span>JioCode ${esc(rec.jio)}</span>
        <span>MRP <b>${money(rec.mrp)}</b></span><span>${cur}</span></div>
      <div class="cols">${priceCol('Default discount',def,dv)}${promo?priceCol('Promotional discount',promo,pv):''}</div>
    </div>
    ${(!def.err&&def.td!=null)?guardRail(rec,def.td):''}
    ${(promo&&!promo.err&&!def.err&&promo.td<def.td)?nb('warn','<b>Promo is less generous than the default.</b> While it runs, customers pay more than they would otherwise — check that is intended.'):''}`;
}
let BULK=[];
function renderBulk(){
  const ta=document.getElementById('c_bulk'),out=document.getElementById('c_bulkout');
  if(!ta||!out) return;
  const START=startDefault();
  const lines=ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  BULK=[];
  const rows=lines.map(line=>{
    const parts=line.split(/[\t,]+|\s{2,}/).map(p=>p.trim()).filter(Boolean);
    let code=parts[0],d=parseFloat(parts[1]),p=parseFloat(parts[2]);
    if(parts.length>3&&isNaN(d)){
      const nums=line.match(/(\d+(?:\.\d+)?)\s*$/);
      code=line.replace(/[,\s]+\d+(?:\.\d+)?\s*$/,'').trim();
      d=nums?parseFloat(nums[1]):NaN; p=NaN;
    }
    const rec=lookup(code);
    if(!rec) return {line,err:`No match for “${code}”`};
    const def=tdFromPrice(rec.mrp,isNaN(d)?null:d);
    if(def.err) return {line,rec,err:def.err};
    const promo=isNaN(p)?null:tdFromPrice(rec.mrp,p);
    if(promo&&promo.err) return {line,rec,err:promo.err};
    const row={rec,def,promo,start:START,promoStart:promo?START:'',promoEnd:''};
    BULK.push(row); return row;
  });
  const ok=rows.filter(r=>!r.err),bad=rows.filter(r=>r.err);
  if(!rows.length){ out.innerHTML=nb('mut','Paste some lines above, then press Calculate.'); return; }
  out.innerHTML=`<div class="tw"><table>
      <thead><tr><th>Seller SKU</th><th>JioCode</th><th class="r">MRP</th><th class="r">Default TD</th><th class="r">Lists at</th><th class="r">Promo TD</th><th class="r">Lists at</th></tr></thead>
      <tbody>${ok.map(r=>`<tr>
        <td class="sku">${esc(r.rec.sku)||'—'}</td><td class="sku">${esc(r.rec.jio)}</td>
        <td class="r num">${money(r.rec.mrp)}</td>
        <td class="r num">${r.def.td.toFixed(2)}%</td><td class="r num">${money(r.def.actual)}</td>
        <td class="r num">${r.promo?r.promo.td.toFixed(2)+'%':'—'}</td>
        <td class="r num">${r.promo?money(r.promo.actual):'—'}</td></tr>`).join('')}</tbody></table></div>
    ${bad.length?nb('crit',`<b>${bad.length} line${bad.length>1?'s':''} could not be used:</b><br>${bad.map(b=>esc(b.line)+' — '+esc(b.err)).join('<br>')}`):''}
    <div class="srcnote">${fmt(ok.length)} row${ok.length===1?'':'s'} ready. Start time is set to <code>${START}</code> — change it in the file if you need a different slot.</div>`;
}
function wireCalc(){
  const code=document.getElementById('c_code'); if(!code) return;
  ['c_code','c_def','c_promo'].forEach(id=>document.getElementById(id).addEventListener('input',renderSingle));
  renderSingle();
  const msg=()=>document.getElementById('c_msg');
  document.getElementById('c_run').onclick=renderBulk;
  document.getElementById('c_dl').onclick=()=>{
    if(!BULK.length) renderBulk();
    if(!BULK.length){ msg().textContent='Nothing to download yet.'; return; }
    const blob=new Blob([buildAjioCSV(BULK)],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='ajio_price_update.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    msg().textContent=`Downloaded ${BULK.length} rows.`;
  };
  document.getElementById('c_copy').onclick=async()=>{
    if(!BULK.length) renderBulk();
    if(!BULK.length){ msg().textContent='Nothing to copy yet.'; return; }
    const csv=buildAjioCSV(BULK);
    try{ await navigator.clipboard.writeText(csv); msg().textContent=`Copied ${BULK.length} rows.`; }
    catch(e){ const ta=document.getElementById('c_bulk'); ta.value=csv; ta.focus(); ta.select();
      msg().textContent='Clipboard blocked — the file is in the box above, selected for you.'; }
  };
}

/* ---------- wiring ---------- */
function wire(tab){
  if(tab==='calc') wireCalc();
  if(tab==='reports'){
    const drop=document.getElementById('drop'),input=document.getElementById('file'),pick=document.getElementById('pick');
    if(drop){
      pick.onclick=()=>input.click();
      input.onchange=()=>handleFiles([...input.files]);
      ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on');}));
      ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on');}));
      drop.addEventListener('drop',ev=>handleFiles([...ev.dataTransfer.files]));
    }
    const rl=document.getElementById('reload'); if(rl) rl.onclick=()=>{ store.del(LS_DATA); location.reload(); };
    const wp=document.getElementById('wipe');   if(wp) wp.onclick=()=>{ store.del(LS_DATA); store.del(LS_QC); store.del(LS_BRAND); location.reload(); };
  }
  if(tab==='catalog'){
    const b=document.getElementById('qcsave');
    if(b) b.onclick=()=>{
      const v=id=>{const n=parseInt(document.getElementById(id).value,10); return isNaN(n)?0:n;};
      QC={uploaded:v('qc_up'),success:v('qc_ok'),manualQcRejected:v('qc_mq'),systemProcessing:v('qc_sp'),hsnRejected:v('qc_hs')};
      store.set(LS_QC,QC); show('catalog');
    };
  }
}

function renderRail(active){
  return `<nav class="rail" aria-label="Sections">
    <div class="brand"><b>${esc(BRAND)||'AJIO Seller'}</b><span>Control panel</span></div>
    ${TABS.map(([id,label,st])=>`<button class="navbtn" data-tab="${id}" aria-current="${id===active}"><span class="dot ${st}"></span>${label}</button>`).join('')}
    <div class="railnote"><b style="color:var(--good)">●</b> your data &nbsp; <b style="color:var(--warn)">●</b> partial &nbsp; <b style="color:var(--rule)">●</b> awaiting report</div></nav>`;
}

function show(tab){
  const fn=VIEWS[tab]||VIEWS.overview;
  document.getElementById('app').innerHTML=`<div class="shell">${renderRail(tab)}<main>${fn()}</main></div>`;
  document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.tab));
  wire(tab);
  try{ history.replaceState(null,'','#'+tab); }catch(e){}
}

/* ---------- first run ---------- */
function onboarding(msg){
  document.getElementById('app').innerHTML=`<div class="onboard">
    <h1>AJIO Seller Control</h1>
    <p>An operations dashboard for AJIO dropship sellers. It holds no data of its own — load your own export and
    everything stays in this browser.${msg?' '+esc(msg):''}</p>
    <ol class="steps">
      <li>In AJIO Seller Central, open <code>Products › Pricing</code>.</li>
      <li>On the <b>Download</b> tab, click <b>Download Trade Discount Excel File</b>.</li>
      <li>When the batch shows <b>Completed</b>, download it and drop the file below.</li>
    </ol>
    <div class="drop" id="drop"><p style="margin:0 0 10px">Drag the Trade Discount file here, or</p>
      <button class="btn pri" id="pick">Choose file</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></div>
    <div id="implog" style="margin-top:14px"></div>
    <p class="srcnote">Nothing is uploaded. The file is parsed locally and kept in this browser's storage only.</p>
  </div>`;
  const drop=document.getElementById('drop'),input=document.getElementById('file'),pick=document.getElementById('pick');
  const load=async files=>{
    for(const f of files){
      try{
        const {objects}=await readSheet(f);
        const recs=normalise(objects);
        if(!recs.length) throw new Error('no JioCode/SKU rows found — is this the Trade Discount file?');
        ROWS=recs; STATE=derive(recs); store.set(LS_DATA,recs);
        if(!BRAND){ BRAND=''; }
        show('overview'); return;
      }catch(err){
        document.getElementById('implog').innerHTML=
          `<div class="act"><div class="sev p1"></div><div class="body"><div class="t">${esc(f.name)}</div>
           <div class="w">Could not read this file: ${esc(err.message)}</div></div></div>`;
      }
    }
  };
  pick.onclick=()=>input.click();
  input.onchange=()=>load([...input.files]);
  ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on');}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on');}));
  drop.addEventListener('drop',ev=>load([...ev.dataTransfer.files]));
}

/* ---------- boot ---------- */
(async function(){
  QC=store.get(LS_QC,null);
  BRAND=store.get(LS_BRAND,'')||'';
  const saved=store.get(LS_DATA,null);
  if(saved&&saved.length){ ROWS=saved; STATE=derive(saved); }
  else{
    // optional local data file, intentionally absent from the public repo
    try{
      const res=await fetch('data/ajio_td.csv',{cache:'no-store'});
      if(res.ok){
        const recs=normalise(parseCSV(await res.text()));
        if(recs.length){ ROWS=recs; STATE=derive(recs); }
      }
    }catch(e){ /* no local data file — expected */ }
  }
  if(!STATE){ onboarding(); return; }
  const start=(location.hash||'').replace('#','');
  show(VIEWS[start]?start:'overview');
})();
</script>
